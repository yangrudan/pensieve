<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c1c"><title>第二章 · 星石之境</title><link rel="stylesheet" href="atlas.css"></head>
<body>
<canvas id="atlas-scene" aria-label="由悬浮岛与彩色魔法石组成的三维地点世界"></canvas><div class="world-shade" aria-hidden="true"></div><div id="stone-labels"></div>
<header class="atlas-header"><a class="wordmark" href="/">✧ <span>THE PENSIEVE<small>记 忆 收 藏 室</small></span></a><nav aria-label="章节"><a href="/">I <span>冥想盆</span></a><a href="/atlas/" aria-current="page">II <span>星石之境</span></a></nav><button id="overview" class="quiet-button">俯瞰星境 ↗</button></header>
<main class="introduction"><p class="eyebrow">CHAPTER II / THE ATLAS OF MEMORIES</p><h1>每一处地方，<br>都有一颗星。</h1><p class="intro-copy">把散落的回忆，交还给它发生的地方。<br>轻触魔法石，寻回属于那里的时光。</p><div class="world-rule"></div><p class="world-caption"><span class="live-dot"></span> 你的地点，正在星境中相连</p></main>
<aside id="place-panel" class="place-panel" hidden aria-label="地点记忆"><button id="close-place" class="panel-close" aria-label="关闭地点">×</button><p class="eyebrow">A PLACE TO REMEMBER</p><div class="place-heading"><span id="place-glyph">◇</span><div><h2 id="place-name"></h2><p id="place-count"></p></div></div><button id="edit-place" class="text-button">编辑地点与颜色 ↗</button><div class="panel-divider"></div><div id="place-memories" class="place-memories"></div></aside>
<footer class="atlas-footer"><div class="footer-heading"><div><p class="eyebrow">YOUR CONSTELLATION</p><span id="atlas-total">正在寻找记忆的坐标…</span></div><button id="add-place" class="quiet-button">＋ 点亮新地点</button></div><nav id="place-rail" class="place-rail" aria-label="选择地点"></nav><div class="footer-notes"><span>拖动环顾 · 滚轮 / 双指缩放 · 点击魔法石</span><span>原片与立体记忆，在此相逢</span></div></footer>
<p id="atlas-status" role="status" aria-live="polite"></p>
<dialog id="place-editor" class="editor"><form id="place-form"><p class="eyebrow">LIGHT A NEW STAR</p><h2 id="editor-title">点亮一个新地点</h2><label for="place-input">地点名称</label><input id="place-input" maxlength="24" required placeholder="例如：杭州的家、大学、海边"><label for="color-input">魔法石的颜色</label><div class="color-row"><input id="color-input" type="color" value="#a69aff"><span>让颜色成为地点的线索</span></div><p id="editor-error" role="alert"></p><div class="editor-actions"><button type="button" id="cancel-editor" class="quiet-button">取消</button><button type="submit" class="primary-button">保存地点</button></div></form></dialog>
<dialog id="memory-dialog" class="atlas-memory"><button id="close-memory" class="panel-close" aria-label="返回地点">×</button><p class="eyebrow">A MOMENT, HELD FOREVER</p><h2 id="viewer-name"></h2><div class="viewer-tabs"><button id="view-photo" aria-pressed="true">原照片</button><button id="view-3d" aria-pressed="false" hidden>立体记忆</button></div><div id="viewer-content"></div><p id="viewer-status" role="status"></p></dialog>
<script type="module" src="atlas.js"></script></body></html>
