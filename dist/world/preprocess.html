<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间输入 · 去除人物前后</title><style>*{box-sizing:border-box}body{margin:0;background:#091318;color:#d7e5dc;font:14px/1.8 system-ui}main{max-width:1300px;padding:35px 24px;margin:auto}a{color:#aacdbb}h1{font-family:serif;font-weight:400;letter-spacing:3px}p{color:#8fae9d}section{display:grid;grid-template-columns:1fr 1fr;gap:22px}article{border:1px solid #94b6a735;background:#11231b;padding:16px;border-radius:6px}h2{font-size:16px;font-weight:400}img{width:100%;display:block}small{color:#8fae9d}.actions{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}@media(max-width:700px){section{grid-template-columns:1fr}}</style><main><a href="/world/">← 返回空间查看页</a><h1>先留下房间，再展开空间。</h1><p>原片保留人物记忆；用于 World 的输入先移除人物，尽量保持桌椅、电脑、物品、墙面与光线。</p><section><article><h2>处理前 · 原照片</h2><img src="../candidates/04-world-dining-room.jpg" alt="清理前，人物坐在餐桌后"><small>作为原始记录保留，不覆盖。</small><div class="actions"><a href="/world/?id=48bc169d57e89f8d9824364daacc180aac77d44dce852d493cac09da1093b06d">查看原照片生成的空间 ↗</a></div></article><article><h2>处理后 · World 输入</h2><img src="../candidates/04-world-dining-room-no-person.jpg" alt="清理后人物被移除，桌椅和电脑仍在原位"><small>AI 移除人物与耳机，补全被遮住的墙面和椅子。</small><div class="actions"><a id="clean-link" href="/world/">查看清理后生成的空间 ↗</a><a href="../candidates/04-world-dining-room-no-person.jpg" download>下载清理版 JPG</a></div></article></section><p>清理不会让单张照片变成真实测量数据。未拍到的房间仍需补全，空间布局是否改善应以两次生成结果对比为准。</p></main><script>fetch('/api/memories').then(r=>r.json()).then(j=>{const m=j.items.filter(x=>x.mode==='world'&&x.name.includes('已去除人物')).at(-1);if(m)document.querySelector('#clean-link').href='/world/?id='+m.id;}).catch(()=>{});</script></html>
